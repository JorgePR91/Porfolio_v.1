name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd porfolio-20.1.5-app && npm install

      - name: Build (set base href to repo name)
        run: |
          cd porfolio-20.1.5-app
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          npm run build -- --base-href=/$REPO_NAME/
        shell: bash

      - name: Ensure SPA 404
        run: |
          cd porfolio-20.1.5-app
          npm run postbuild || true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./porfolio-20.1.5-app/dist/porfolio-20.1.5-app/browser
