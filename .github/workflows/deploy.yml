name: Deploy Angular to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd porfolio-20.1.5-app && npm install

      - name: Build (set base href to repo name)
        run: |
          cd porfolio-20.1.5-app
          REPO_NAME=${GITHUB_REPOSITORY#*/}
          npm run build -- --base-href=/$REPO_NAME/
        shell: bash

      - name: Ensure SPA 404
        run: |
          cd porfolio-20.1.5-app
          npm run postbuild || true

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: porfolio-20.1.5-app/dist/porfolio-20.1.5-app/browser
          token: ${{ secrets.GITHUB_TOKEN }}
