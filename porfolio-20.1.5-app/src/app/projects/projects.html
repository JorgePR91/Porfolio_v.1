<section id="app-projects">
  <div class="section-title">
    <h2>Projectes</h2>
    <div class="title-line"></div>
  </div>

  <div class="projects-container">
    @for (project of projectCards; track project.title) {
      <article class="project">
        <h3>{{ project.title }}</h3>
        <div class="imatge-container">
          <a [href]="project.projectUrl" target="_blank" rel="noopener noreferrer">
            <img [src]="project.image" [alt]="project.imageAlt" width="400" height="300" loading="lazy" />
          </a>
        </div>
        <p>{{ project.description }}</p>
        <div class="etiquetes-container">
          @for (tech of project.technologies; track tech) {
            <span class="etiqueta">{{ tech }}</span>
          }
        </div>
        <a class="project-cta" [href]="project.projectUrl" target="_blank" rel="noopener noreferrer">Veure projecte</a>
      </article>
    }
  </div>
</section>
